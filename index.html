<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>何庆丰 · 日拱一卒</title>
  <meta name="description" content="何庆丰的个人网站：写作、产品与代码。" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部 -->
  <header class="header">
    <div class="container header-inner">
      <a href="#home" class="brand">
        <span class="brand-name" id="site-name">何庆丰</span>
        <span class="brand-slogan" id="site-slogan">日拱一卒，功不唐捐</span>
      </a>
      <nav class="nav" id="nav">
        <a href="#home" class="active">首页</a>
        <a href="#writing">文章</a>
        <a href="#projects">项目</a>
        <a href="#about">关于</a>
        <a href="#" target="_blank" rel="noopener" class="github-link">GitHub ↗</a>
      </nav>
      <button class="menu-toggle" id="menu-toggle" aria-label="打开菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- 主体 -->
  <div class="container layout" id="home">
    <!-- 主内容 -->
    <main class="main">
      <!-- 高亮卡片 -->
      <div class="highlights" id="highlights-grid"></div>

      <!-- 最近在写 -->
      <section class="block" id="writing">
        <div class="block-head">
          <h2>最近在写</h2>
          <a href="#writing" class="block-more">全部 →</a>
        </div>
        <div id="posts-list"></div>
      </section>

      <!-- 项目 -->
      <section class="block" id="projects">
        <div class="block-head">
          <h2>项目</h2>
        </div>
        <div class="projects-grid" id="projects-grid"></div>
      </section>
    </main>

    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="widget">
        <h3>搜索</h3>
        <input type="search" id="search-input" class="search-input" placeholder="搜索文章关键词…" />
      </div>

      <div class="widget" id="about">
        <div class="about-head">
          <div class="avatar" id="sidebar-avatar">何</div>
          <div>
            <div class="about-name" id="sidebar-name">何庆丰</div>
            <div class="about-meta">写代码 · 做产品 · 写点东西</div>
          </div>
        </div>
        <div class="about-text" id="sidebar-about"></div>
      </div>

      <div class="widget">
        <h3>近期文章</h3>
        <ul class="link-list" id="recent-posts"></ul>
      </div>

      <div class="widget">
        <h3>分类</h3>
        <ul class="link-list" id="categories"></ul>
      </div>

      <div class="widget">
        <h3>外站</h3>
        <ul class="link-list">
          <li><a href="#" target="_blank" rel="noopener" class="github-link">GitHub</a></li>
          <li><a href="mailto:you@example.com" id="contact-email">邮箱</a></li>
        </ul>
      </div>
    </aside>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-links">
        <a href="#" target="_blank" rel="noopener" class="github-link">GitHub</a>
        <a href="#writing">文章</a>
        <a href="#projects">项目</a>
        <a href="#about">关于</a>
      </div>
      <p>© <span id="year"></span> <span id="footer-name">何庆丰</span> · <span id="footer-slogan">日拱一卒</span></p>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
