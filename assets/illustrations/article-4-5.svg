<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">克制检查</title><desc id="desc">清空杂物后，用户终于一眼看见最重要的按钮</desc>
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="5" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/></filter>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1" fill="#393125" opacity=".12"/><circle cx="20" cy="18" r=".8" fill="#A87725" opacity=".12"/><path d="M10 24 l3 -1" stroke="#393125" stroke-width=".7" opacity=".1"/></pattern>
  </defs>
  <style>
    .sketch{filter:url(#rough)}
    .kicker{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:3px}
    .title{font:700 42px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif}
    .subtitle{font:400 19px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif}
    .note{font:500 20px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#393125}
    .sticky{font:700 18px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#393125}
    .bubble{font:600 18px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#393125}
    .tiny{font:600 15px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#fff}
    .face{font:700 18px "Kaiti SC",STKaiti,"KaiTi",sans-serif;fill:#393125}
    .bigq{font:800 82px "Kaiti SC",STKaiti,"KaiTi",sans-serif;fill:#A87725}
  </style>
  <rect width="1200" height="675" rx="28" fill="#FFFAEF"/>
  <g opacity=".5"><path d="M30 115 Q260 90 500 112 T1170 100" stroke="#E9D29C" stroke-width="3" fill="none"/><path d="M45 585 Q350 610 650 585 T1160 595" stroke="#E9D29C" stroke-width="3" fill="none"/></g>
  <path d="M24 30 Q310 20 590 28 T1174 25 L1180 640 Q910 654 610 646 T25 650Z" fill="none" stroke="#393125" stroke-width="3" stroke-dasharray="9 7" opacity=".45" class="sketch"/>
