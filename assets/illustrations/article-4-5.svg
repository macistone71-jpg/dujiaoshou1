      <circle cx="270" cy="346" r="34" fill="#FFD9BC" stroke="#302A26" stroke-width="4"/>
      <path d="M239 337 q30 -45 62 0 q-13 -10 -20 -26 q-20 18 -42 20" fill="#43352F" stroke="#302A26" stroke-width="3"/>
