  <text x="68" y="123" class="title" fill="#3D2D32">上线验证</text>
  <text x="68" y="156" class="subtitle" fill="#3D2D32" opacity=".72">发布那晚，小何盯着三块数据屏不敢眨眼</text>
  <g transform="translate(0 32)"><path d="M90 535 Q260 522 430 536 T770 534 T1110 538" stroke="#3D2D32" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 10"/><g class="sketch" transform="translate(250 530) scale(.8) translate(-250 -530)">
