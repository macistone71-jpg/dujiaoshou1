<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">上线验证</title><desc id="desc">发布那晚，小何盯着三块数据屏不敢眨眼</desc>
  <defs>
    <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="4" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/></filter>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r="1" fill="#3D2D32" opacity=".12"/><circle cx="20" cy="18" r=".8" fill="#B34E68" opacity=".12"/><path d="M10 24 l3 -1" stroke="#3D2D32" stroke-width=".7" opacity=".1"/></pattern>
  </defs>
  <style>
    .sketch{filter:url(#rough)}
    .kicker{font:700 16px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:3px}
    .title{font:700 42px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif}
    .subtitle{font:400 19px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif}
    .note{font:500 20px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#3D2D32}
    .sticky{font:700 18px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#3D2D32}
    .bubble{font:600 18px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#3D2D32}
    .tiny{font:600 15px "Kaiti SC",STKaiti,"KaiTi","PingFang SC",sans-serif;fill:#fff}
    .face{font:700 18px "Kaiti SC",STKaiti,"KaiTi",sans-serif;fill:#3D2D32}
    .bigq{font:800 82px "Kaiti SC",STKaiti,"KaiTi",sans-serif;fill:#B34E68}
  </style>
  <rect width="1200" height="675" rx="28" fill="#FFF5F7"/>
  <g opacity=".5"><path d="M30 115 Q260 90 500 112 T1170 100" stroke="#F0C5CF" stroke-width="3" fill="none"/><path d="M45 585 Q350 610 650 585 T1160 595" stroke="#F0C5CF" stroke-width="3" fill="none"/></g>
